<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 布局</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            background-color: #eee;
            background: url(https://s21.ax1x.com/2024/09/17/pAKEpY6.jpg) no-repeat center/cover fixed;
        }

        .yinYing {
            box-shadow: rgb(0 0 0 / 20%) 0px 2px 1px 1px,
                        rgb(0 0 0 / 14%) 0px 1px 1px 0px,
                        rgb(0 0 0 / 12%) 0px 1px 3px 0px;
        }

        .flex {
            display: flex;
        }

        .baiSe {
            background-color: transparent;
        }

        .flex1 {
            flex: 1;
        }

        .column {
            flex-direction: column;
        }

        .mg8 {
            margin: 8px;
        }

        .mgr8 {
            margin-right: 8px;
        }

        .mgt8 {
            margin-top: 8px;
        }

        .daoHang {
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            cursor: pointer;
        }

        .neiRong::-webkit-scrollbar {
            display: none;
        }

        p {
            color: #fff;
            font-size: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.5;
            outline: none;
            --c: lightseagreen;
            text-shadow: 0 0 10px var(--c),
                         0 0 20px var(--c),
                         0 0 40px var(--c),
                         0 0 80px var(--c),
                         0 0 160px var(--c);
            animation: animate 5s linear infinite;
        }

        @keyframes animate {
            to {
                filter: hue-rotate(360deg);
            }
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal-content button {
            width: 100%;
            padding: 10px;
            background: lightseagreen;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 6px;
        }

        .modal-content button.secondary {
            background: #666;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .success-msg {
            color: green;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .link-text {
            font-size: 13px;
            margin-top: 10px;
            color: #333;
            cursor: pointer;
            text-align: center;
        }

        .user-info-text {
            color: #fff;
            margin-left: 10px;
        }

        /* ========== 手机端响应式：侧边栏变成顶部导航 ========== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            /* 侧边栏变为顶部横向导航 */
            .ceBian {
                display: flex !important;
                width: 100% !important;
                max-width: 100% !important;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                z-index: 10;
            }

            /* 头像区域横排 */
            .ceBian > .flex {
                border-bottom: none;
                margin-right: 10px;
                flex-shrink: 0;
            }

            /* 导航项容器横排 */
            .ceBian .flex1 {
                display: flex;
                flex-direction: row;
            }

            /* 每个导航项 */
            .daoHang {
                border-bottom: none;
                border-right: 1px solid rgba(255, 255, 255, 0.2);
                padding: 8px 15px;
                white-space: nowrap;
            }

            /* 最后一个导航项去掉右边框 */
            .daoHang:last-child {
                border-right: none;
            }

            /* 头部标题变小 */
            p {
                font-size: 24px !important;
                letter-spacing: 1px;
            }

            /* 头部栏高度自适应 */
            .header-bar {
                height: auto !important;
                padding: 15px 0;
            }

            /* 内容区垂直排列 */
            .neiRong {
                flex-direction: column;
            }

            /* 数据块垂直排列 */
            .shuJuQu {
                flex-direction: column;
            }

            .shuJu {
                margin: 0 0 8px !important;
                flex: auto;
            }

            /* 右区边距调整 */
            .youQu {
                margin-left: 8px !important;
                margin-right: 8px !important;
            }

            /* 左区去掉右边距 */
            .left-area {
                margin-right: 0 !important;
            }

            /* 整体背景固定 */
            body {
                background-attachment: fixed;
            }
        }
    </style>
</head>
<body class="flex">

    <!-- 登录/注册弹窗 -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">登录</h3>
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>
            <input type="email" id="emailInput" placeholder="邮箱">
            <input type="password" id="passwordInput" placeholder="密码">
            <button id="authActionBtn">登录</button>
            <div class="link-text" id="switchMode">没有账号？立即注册</div>
            <button class="secondary" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <!-- 侧边栏（电脑端左侧竖排，手机端顶部横排） -->
    <div class="ceBian baiSe yinYing" style="width: 200px; z-index: 2;">
        <!-- 头像区域 -->
        <div style="padding: 10px; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.2);" class="flex">
            <img id="userAvatar" src="https://s21.ax1x.com/2024/09/17/pAKE9fK.png" width="40px" height="40px" alt="" />
            <div id="userName" class="user-info-text">小陈</div>
        </div>
        <!-- 导航项 -->
        <div class="flex1">
            <div class="daoHang">导航</div>
            <div class="daoHang" id="authLink">登录 / 注册</div>
            <div class="daoHang" id="logoutLink" style="display:none;">退出登录</div>
            <div class="daoHang">导航</div>
            <div class="daoHang">导航</div>
            <div class="daoHang">导航</div>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="flex1 flex column">
        <!-- 头部栏 -->
        <div class="baiSe yinYing header-bar" style="height: 60px; z-index: 1; border-bottom: 1px solid rgba(255,255,255,0.2);">
            <div><p>小陈的个人网站</p></div>
        </div>
        <!-- 内容区 -->
        <div style="overflow: auto" class="neiRong flex1 flex">
            <!-- 左区 -->
            <div class="flex column mg8 left-area" style="flex: 3">
                <div class="flex shuJuQu">
                    <div style="height: 100px" class="shuJu flex1 baiSe mgr8 yinYing"></div>
                    <div style="height: 100px" class="shuJu flex1 baiSe mgr8 yinYing"></div>
                    <div style="height: 100px" class="shuJu flex1 baiSe mgr8 yinYing"></div>
                    <div style="height: 100px" class="shuJu flex1 baiSe yinYing"></div>
                </div>
                <div class="flex column">
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                    <div style="height: 160px" class="baiSe mgt8 yinYing"></div>
                </div>
            </div>
            <!-- 右区 -->
            <div class="youQu flex column mgr8 mgt8" style="flex: 1">
                <div style="height: 150px" class="baiSe yinYing"></div>
                <div style="height: 300px" class="baiSe mgt8 yinYing"></div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDyhvsQG_UbAcrvFrZKY2iDjI1xs49pw4c",
            authDomain: "zhuce-31afe.firebaseapp.com",
            projectId: "zhuce-31afe",
            storageBucket: "zhuce-31afe.firebasestorage.app",
            messagingSenderId: "712987001352",
            appId: "1:712987001352:web:19ac82dcb317dc6daf87bd",
            measurementId: "G-S95ZVB7YFV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM 元素
        const modal = document.getElementById('authModal');
        const modalTitle = document.getElementById('modalTitle');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const authActionBtn = document.getElementById('authActionBtn');
        const switchMode = document.getElementById('switchMode');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const authLink = document.getElementById('authLink');
        const logoutLink = document.getElementById('logoutLink');
        const userNameEl = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');

        let isLoginMode = true;

        function setMode(login) {
            isLoginMode = login;
            if (login) {
                modalTitle.textContent = '登录';
                authActionBtn.textContent = '登录';
                switchMode.textContent = '没有账号？立即注册';
            } else {
                modalTitle.textContent = '注册';
                authActionBtn.textContent = '注册';
                switchMode.textContent = '已有账号？去登录';
            }
            errorMsg.textContent = '';
            successMsg.textContent = '';
            emailInput.value = '';
            passwordInput.value = '';
        }

        function showModal() {
            modal.style.display = 'flex';
            setMode(true);
        }
        function hideModal() {
            modal.style.display = 'none';
        }

        authLink.addEventListener('click', showModal);
        closeModalBtn.addEventListener('click', hideModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideModal();
        });
        switchMode.addEventListener('click', () => setMode(!isLoginMode));

        authActionBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            errorMsg.textContent = '';
            successMsg.textContent = '';

            if (!email || !password) {
                errorMsg.textContent = '请填写邮箱和密码';
                return;
            }

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                    successMsg.textContent = '登录成功！';
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                    successMsg.textContent = '注册成功！';
                }
                setTimeout(hideModal, 800);
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg.textContent = '该邮箱已被注册';
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg.textContent = '邮箱或密码错误';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg.textContent = '密码应至少6位';
                } else {
                    errorMsg.textContent = error.message;
                }
            }
        });

        logoutLink.addEventListener('click', async () => {
            try {
                await auth.signOut();
            } catch (error) {
                console.error('退出失败', error);
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                authLink.style.display = 'none';
                logoutLink.style.display = 'block';
                const displayName = user.email ? user.email.split('@')[0] : '用户';
                userNameEl.textContent = displayName;
            } else {
                authLink.style.display = 'block';
                logoutLink.style.display = 'none';
                userNameEl.textContent = '小陈';
            }
        });
    </script>
</body>
</html>
